<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manhwa Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 20px;
    }
    .gallery {
      max-width: 900px;
      margin: auto;
    }
    .manhwa-row {
      display: flex;
      background: #fff;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .thumbnail {
      flex: 0 0 150px;
    }
    .thumbnail img {
      width: 150px;
      height: auto;
      display: block;
    }
    .details {
      padding: 15px;
      flex: 1;
    }
    .details h2 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #333;
    }
    .details p {
      margin: 5px 0;
      color: #555;
    }
    .details a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: #007BFF;
      font-weight: bold;
    }
    .details a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="gallery">
    {% for manhwa in manhwas %}
    <div class="manhwa-row">
      <div class="thumbnail">
        <img src="{{manhwa['thumbnailUrl']}}" alt="{{manhwa['title']}} Thumbnail" onerror="this.style.display='none'">
      </div>
      <div class="details">
        <h2>{{ manhwa['title'] }}</h2>
        <p><strong>Author:</strong> {{ manhwa['author'] }}</p>
        <p><strong>Genre:</strong> {% for genre in manhwa['genre'] %} {{genre}} {% endfor %}</p>
        {% for chapter in manhwa['chapters'][:1] %}
          <p><strong>Latest Chapter:</strong>  {{chapter['name']}} </p>
          <a href="{{ chapter['url'] }}" target="_blank">Read Now</a>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
